[project]
name = "studybuddy"
version = "0.1.0"
description = "StudyBuddy backend: chat orchestrator pipeline (LLD 03) and services"
requires-python = ">=3.12"
dependencies = []  # core pipeline is stdlib-only; API layer adds fastapi and uvicorn (see README)

[project.optional-dependencies]
api = ["fastapi", "uvicorn[standard]", "pydantic>=2"]
qdrant = ["qdrant-client>=1.10"]
providers = ["httpx"]
dev = ["pytest", "pytest-asyncio", "httpx", "qdrant-client>=1.10"]

[tool.setuptools.packages.find]
include = ["studybuddy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
